name: Run Global Email Engine

on:
  workflow_dispatch: # 允许你在网页上随时手动点击按钮运行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码仓库
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 执行云端爬虫程序
        run: |
          python main.py

      - name: 5. 保存并上传 CSV 结果文件
        uses: actions/upload-artifact@v4
        with:
          name: indonesia_machinery_csv
          path: output/indonesia_machinery.csv
